name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Coordinator embeds the panel, so it is built before any Go step.
      - name: Build and test the panel
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Install the browser for the panel's lab test
        working-directory: web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw
        run: npx playwright install --with-deps chromium

      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2
          # sch_netem ships in linux-modules-extra on the runner's Azure kernel.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe sch_netem
          sudo modprobe wireguard

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
        run: go build -o bin/ ./cmd/...

      - name: Build the lab's binaries
        # The pinned amneziawg-go is a tool dependency in go.mod.
        run: go build -o "$RUNNER_TEMP/darz-bin/" ./cmd/agent github.com/amnezia-vpn/amneziawg-go

      - name: Download the pinned Prometheus and Alertmanager for the lab
        # The versions and checksums the Coordinator VM runs (ADR 0006).
        env:
          PROMETHEUS: "3.13.4"
          PROMETHEUS_SHA256: 87f21a66f96c597a189cef8d640e8921b621fc17a9feff707c332c4f3b3ddd56
          ALERTMANAGER: "0.34.1"
          ALERTMANAGER_SHA256: 265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS}/prometheus-${PROMETHEUS}.linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER}/alertmanager-${ALERTMANAGER}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus-${PROMETHEUS}.linux-amd64.tar.gz" | sha256sum -c -
          echo "${ALERTMANAGER_SHA256}  alertmanager-${ALERTMANAGER}.linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "prometheus-${PROMETHEUS}.linux-amd64.tar.gz" --strip-components=1 -C darz-bin "prometheus-${PROMETHEUS}.linux-amd64/prometheus" "prometheus-${PROMETHEUS}.linux-amd64/promtool"
          tar -xzf "alertmanager-${ALERTMANAGER}.linux-amd64.tar.gz" --strip-components=1 -C darz-bin "alertmanager-${ALERTMANAGER}.linux-amd64/alertmanager" "alertmanager-${ALERTMANAGER}.linux-amd64/amtool"

      - name: Test, with the lab (as root)
        run: go test -exec "sudo env DARZ_BIN=$RUNNER_TEMP/darz-bin PATH=$PATH PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw" -race -count=1 -v -timeout 20m ./...
