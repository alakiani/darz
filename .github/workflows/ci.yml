name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Coordinator embeds the panel, so it is built before any Go step.
      - name: Build and test the panel
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Install the browser for the panel's lab test
        working-directory: web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw
        run: npx playwright install --with-deps chromium

      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2
          # sch_netem ships in linux-modules-extra on the runner's Azure kernel.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe sch_netem
          sudo modprobe wireguard
          # GRE Transport instances (ADR 0009).
          sudo modprobe ip_gre

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
        run: go build -o bin/ ./cmd/...

      - name: Build the lab's binaries
        # The pinned amneziawg-go is a tool dependency in go.mod.
        run: go build -o "$RUNNER_TEMP/ways-bin/" ./cmd/agent github.com/amnezia-vpn/amneziawg-go

      - name: Download the pinned Prometheus and Alertmanager for the lab
        # The versions and checksums the Coordinator VM runs (ADR 0006).
        run: |
          set -euo pipefail
          . deploy/versions.env
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS}/prometheus-${PROMETHEUS}.linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER}/alertmanager-${ALERTMANAGER}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus-${PROMETHEUS}.linux-amd64.tar.gz" | sha256sum -c -
          echo "${ALERTMANAGER_SHA256}  alertmanager-${ALERTMANAGER}.linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "prometheus-${PROMETHEUS}.linux-amd64.tar.gz" --strip-components=1 -C ways-bin "prometheus-${PROMETHEUS}.linux-amd64/prometheus" "prometheus-${PROMETHEUS}.linux-amd64/promtool"
          tar -xzf "alertmanager-${ALERTMANAGER}.linux-amd64.tar.gz" --strip-components=1 -C ways-bin "alertmanager-${ALERTMANAGER}.linux-amd64/alertmanager" "alertmanager-${ALERTMANAGER}.linux-amd64/amtool"

      - name: Test, with the lab (as root)
        run: go test -exec "sudo env WAYS_BIN=$RUNNER_TEMP/ways-bin PATH=$PATH PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw" -race -count=1 -v -timeout 20m ./...

  # The deployment playbooks against Ubuntu 26.04 containers, with two
  # release bundles built as the Release workflow builds them.
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the panel
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ways-downloads
          key: ways-downloads-${{ hashFiles('deploy/versions.env') }}

      - name: Build two releases
        run: |
          export WAYS_DOWNLOAD_CACHE="$HOME/.cache/ways-downloads"
          scripts/build-release.sh ci-1 "$RUNNER_TEMP/releases/ci-1"
          scripts/build-release.sh ci-2 "$RUNNER_TEMP/releases/ci-2"

      - name: Install Ansible
        run: pipx install ansible-core==2.21.4

      - name: Prepare the host
        run: |
          sudo modprobe wireguard
          sudo modprobe ip_gre
          echo "172.30.0.10 wayfinder.ir" | sudo tee -a /etc/hosts

      - name: Test the playbooks
        env:
          WAYS_DEPLOY_TEST: "1"
        run: WAYS_DEPLOY_RELEASES="$RUNNER_TEMP/releases" go test -count=1 -v -timeout 30m ./internal/deploytest
