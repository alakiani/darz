name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Coordinator embeds the panel, so it is built before any Go step.
      - name: Build and test the panel
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Install the browser for the panel's lab test
        working-directory: web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw
        run: npx playwright install --with-deps chromium

      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2
          # sch_netem ships in linux-modules-extra on the runner's Azure kernel.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe sch_netem
          sudo modprobe wireguard

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
        run: go build -o bin/ ./cmd/...

      - name: Build the lab's binaries
        # The pinned amneziawg-go is a tool dependency in go.mod.
        run: go build -o "$RUNNER_TEMP/darz-bin/" ./cmd/agent github.com/amnezia-vpn/amneziawg-go

      - name: Test, with the lab (as root)
        run: go test -exec "sudo env DARZ_BIN=$RUNNER_TEMP/darz-bin PATH=$PATH PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw" -race -count=1 -v -timeout 20m ./...
