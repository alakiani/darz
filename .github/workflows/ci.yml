name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2
          # sch_netem ships in linux-modules-extra on the runner's Azure kernel.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe sch_netem

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
        run: go build -o bin/ ./cmd/...

      - name: Test, with the lab (as root)
        run: go test -exec sudo -race -count=1 -v ./...
