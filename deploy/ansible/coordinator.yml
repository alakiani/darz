# coordinator.yml installs or upgrades the Coordinator VM (ADR 0001, 0006):
# the Coordinator, Prometheus, Alertmanager and Grafana, pushed from the
# release on the laptop. On the first run it also brings back the pinned CA
# certificate and the laptop's nodes:enroll token, and prints the first
# Admin's Invite.
#
#   scripts/ways-ansible coordinator.yml
- name: Coordinator VM
  hosts: coordinators
  become: true
  vars:
    ways_tls_cert: "{{ lookup('env', 'TLS_CERT_FILE') }}"
    ways_tls_key: "{{ lookup('env', 'TLS_KEY_FILE') }}"
    ways_monitor_from: "{{ lookup('env', 'COORD_EGRESS_IP') or ansible_host }}"
    ways_arvan_api_key: "{{ lookup('env', 'ARVAN_API_KEY') }}"
    ways_telegram_token: "{{ lookup('env', 'TELEGRAM_TOKEN') }}"
    ways_telegram_chat: "{{ lookup('env', 'TELEGRAM_CHAT') }}"
    ways_backup_s3_endpoint: "{{ lookup('env', 'BACKUP_S3_ENDPOINT') }}"
    ways_backup_s3_region: "{{ lookup('env', 'BACKUP_S3_REGION') or 'us-east-1' }}"
    ways_backup_s3_bucket: "{{ lookup('env', 'BACKUP_S3_BUCKET') }}"
    ways_backup_s3_access_key: "{{ lookup('env', 'BACKUP_S3_ACCESS_KEY') }}"
    ways_backup_s3_secret_key: "{{ lookup('env', 'BACKUP_S3_SECRET_KEY') }}"
    ways_backup_age_recipient: "{{ lookup('env', 'BACKUP_AGE_RECIPIENT') }}"
    ways_repo: "{{ playbook_dir }}/../.."
  pre_tasks:
    - name: Check the laptop has what the Coordinator needs
      ansible.builtin.assert:
        that:
          - ways_release | length > 0
          - ways_backup_age_recipient is match('^age1')
          - (ways_tls_cert | length > 0) == (ways_tls_key | length > 0)
          - (ways_telegram_token | length > 0) == (ways_telegram_chat | length > 0)
        fail_msg: >-
          Set WAYS_RELEASE and BACKUP_AGE_RECIPIENT, and TLS_CERT_FILE with
          TLS_KEY_FILE, TELEGRAM_TOKEN with TELEGRAM_CHAT, in pairs
          (scripts/provision-fleet.sh writes them to ~/.ways/fleet.env).

    - name: Check the release against its SHA256SUMS
      ansible.builtin.include_tasks: tasks/verify-release.yml

    - name: Read the release's pinned versions
      ansible.builtin.set_fact:
        ways_versions: >-
          {{ dict(lookup('file', ways_release_dir ~ '/versions.env').splitlines()
             | map('regex_findall', '^([A-Z_0-9]+)=(.*)$') | select | map('first')) }}

  tasks:
    - name: Install Ubuntu's packages
      ansible.builtin.apt:
        name: "{{ ['prometheus-node-exporter'] + (['chrony'] if ways_chrony else []) }}"
        update_cache: true
        cache_valid_time: 3600

    - name: Keep node_exporter on loopback
      ansible.builtin.template:
        src: node-exporter.default.j2
        dest: /etc/default/prometheus-node-exporter
        mode: "0644"
      notify: Restart node_exporter

    - name: Create the ways group
      ansible.builtin.group:
        name: ways
        system: true

    - name: Create the ways user, which runs the Coordinator
      ansible.builtin.user:
        name: ways
        group: ways
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/ways
        create_home: false

    - name: Create the ways-monitor user, which runs Prometheus, Alertmanager and Grafana
      ansible.builtin.user:
        name: ways-monitor
        groups: [ways] # to read Prometheus's client certificate
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/ways-monitor
        create_home: false

    - name: Create the directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/ways, owner: root, group: ways, mode: "0750" }
        - { path: /etc/ways/ca, owner: ways, group: ways, mode: "0700" }
        - { path: /etc/ways/secrets, owner: ways, group: ways, mode: "0700" }
        - { path: /etc/ways/prometheus, owner: ways, group: ways, mode: "0750" }
        - { path: /etc/ways/alertmanager, owner: root, group: ways, mode: "0750" }
        - { path: /etc/ways/grafana, owner: root, group: ways, mode: "0750" }
        - { path: /etc/ways/grafana/provisioning, owner: root, group: ways, mode: "0750" }
        - { path: /etc/ways/grafana/provisioning/dashboards, owner: root, group: ways, mode: "0750" }
        - { path: /etc/ways/grafana/provisioning/datasources, owner: root, group: ways, mode: "0750" }
        - { path: /etc/ways/grafana/dashboards, owner: root, group: ways, mode: "0750" }
        - { path: /var/lib/ways, owner: ways, group: ways, mode: "0700" }
        - { path: /var/lib/ways-monitor, owner: ways-monitor, group: ways-monitor, mode: "0750" }
        - { path: /var/lib/ways-monitor/prometheus, owner: ways-monitor, group: ways-monitor, mode: "0750" }
        - { path: /var/lib/ways-monitor/alertmanager, owner: ways-monitor, group: ways-monitor, mode: "0750" }
        - { path: /var/lib/ways-monitor/grafana, owner: ways-monitor, group: ways-monitor, mode: "0750" }
        - { path: /usr/local/lib/ways, owner: root, group: root, mode: "0755" }

    - name: Install the Coordinator
      ansible.builtin.copy:
        src: "{{ ways_release_dir }}/ways-coordinator"
        dest: /usr/local/bin/ways-coordinator
        mode: "0755"
      notify: Restart the Coordinator

    - name: Install the secrets
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "/etc/ways/secrets/{{ item.name }}"
        owner: ways
        group: ways
        mode: "0600"
      loop:
        - { name: tls.crt, content: "{{ lookup('file', ways_tls_cert) ~ '\n' if ways_tls_cert else '' }}", when: "{{ ways_tls_cert | length > 0 }}" }
        - { name: tls.key, content: "{{ lookup('file', ways_tls_key) ~ '\n' if ways_tls_key else '' }}", when: "{{ ways_tls_key | length > 0 }}" }
        - { name: arvan-api-key, content: "{{ ways_arvan_api_key }}\n", when: "{{ ways_arvan_api_key | length > 0 }}" }
        - { name: telegram-token, content: "{{ ways_telegram_token }}\n", when: "{{ ways_telegram_token | length > 0 }}" }
        - { name: backup-s3-key, content: "{{ ways_backup_s3_access_key }}\n{{ ways_backup_s3_secret_key }}\n", when: "{{ ways_backup_s3_endpoint | length > 0 }}" }
      when: item.when | bool
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      notify: Restart the Coordinator

    - name: Install the Coordinator's unit
      ansible.builtin.template:
        src: ways-coordinator.service.j2
        dest: /etc/systemd/system/ways-coordinator.service
        mode: "0644"
      notify: Restart the Coordinator

    - name: Unpack Prometheus, Alertmanager and Grafana
      ansible.builtin.unarchive:
        src: "{{ ways_release_dir }}/{{ item.name }}-{{ item.version }}.linux-amd64.tar.gz"
        dest: /usr/local/lib/ways
        creates: "/usr/local/lib/ways/{{ item.dir }}-{{ item.version }}/{{ item.bin }}"
        owner: root
        group: root
      loop:
        - { name: prometheus, dir: prometheus, version: "{{ ways_versions.PROMETHEUS }}", bin: prometheus }
        - { name: alertmanager, dir: alertmanager, version: "{{ ways_versions.ALERTMANAGER }}", bin: alertmanager }
        - { name: grafana, dir: grafana, version: "{{ ways_versions.GRAFANA }}", bin: bin/grafana }
      loop_control:
        label: "{{ item.name }} {{ item.version }}"

    # The tarballs unpack as <name>-<version>.linux-amd64; Grafana's as
    # grafana-<version>. Give each one the plain <name>-<version> path the
    # units use.
    - name: Name the unpacked directories by version
      ansible.builtin.command:
        cmd: "mv /usr/local/lib/ways/{{ item }}-{{ ways_versions[item | upper] }}.linux-amd64 /usr/local/lib/ways/{{ item }}-{{ ways_versions[item | upper] }}"
        creates: "/usr/local/lib/ways/{{ item }}-{{ ways_versions[item | upper] }}"
        removes: "/usr/local/lib/ways/{{ item }}-{{ ways_versions[item | upper] }}.linux-amd64"
      loop: [prometheus, alertmanager]

    - name: Install the monitoring configuration
      ansible.builtin.copy:
        src: "{{ ways_repo }}/deploy/monitoring/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: ways
        mode: "0640"
      loop:
        - { src: prometheus.yml, dest: /etc/ways/prometheus/prometheus.yml, service: prometheus }
        - { src: rules.yml, dest: /etc/ways/prometheus/rules.yml, service: prometheus }
        - { src: alertmanager.yml, dest: /etc/ways/alertmanager/alertmanager.yml, service: alertmanager }
        - { src: grafana/provisioning/ways.yml, dest: /etc/ways/grafana/provisioning/dashboards/ways.yml, service: grafana }
        - { src: grafana/datasources/ways.yml, dest: /etc/ways/grafana/provisioning/datasources/ways.yml, service: grafana }
        - { src: grafana/dashboards/mesh.json, dest: /etc/ways/grafana/dashboards/mesh.json, service: grafana }
      loop_control:
        label: "{{ item.dest }}"
      register: monitoring_config

    - name: Install the monitoring units
      ansible.builtin.template:
        src: "ways-{{ item }}.service.j2"
        dest: "/etc/systemd/system/ways-{{ item }}.service"
        mode: "0644"
      loop: [prometheus, alertmanager, grafana]
      register: monitoring_units

    - name: Start the Coordinator
      ansible.builtin.systemd_service:
        name: ways-coordinator
        enabled: true
        state: started
        daemon_reload: true

    - name: Start node_exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Start Prometheus, Alertmanager and Grafana, restarting any whose files changed
      ansible.builtin.systemd_service:
        name: "ways-{{ item }}"
        enabled: true
        daemon_reload: true
        state: >-
          {{ 'restarted'
             if (monitoring_config.results | selectattr('changed') | selectattr('item.service', 'eq', item) | list)
             or (monitoring_units.results | selectattr('changed') | selectattr('item', 'eq', item) | list)
             else 'started' }}
      loop: [prometheus, alertmanager, grafana]

    - name: Run the handlers now, so the Coordinator runs this release
      ansible.builtin.meta: flush_handlers

    - name: Wait for the Coordinator's CA
      ansible.builtin.wait_for:
        path: /etc/ways/ca/ca.crt
        timeout: 60

    - name: Wait for the Agent API
      ansible.builtin.wait_for:
        port: 8443
        timeout: 60

    - name: Bring the CA certificate back to the laptop, for enroll.yml to pin
      ansible.builtin.fetch:
        src: /etc/ways/ca/ca.crt
        dest: "{{ ways_home }}/ca.crt"
        flat: true

    - name: Look for the laptop's nodes:enroll token
      ansible.builtin.stat:
        path: "{{ ways_home }}/enroll-token"
      delegate_to: localhost
      become: false
      register: laptop_token

    - name: Mint the laptop's nodes:enroll token (ADR 0002)
      ansible.builtin.command:
        cmd: /usr/local/bin/ways-coordinator token create -db /var/lib/ways/ways.db -name laptop
      become_user: ways
      register: minted
      no_log: true
      when: not laptop_token.stat.exists

    - name: Keep the token on the laptop only
      ansible.builtin.copy:
        content: "{{ minted.stdout | trim }}\n"
        dest: "{{ ways_home }}/enroll-token"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      when: not laptop_token.stat.exists

    - name: Check whether the first Admin was invited
      ansible.builtin.stat:
        path: /var/lib/ways/first-admin-invited
      register: invited

    - name: Make the first Admin's Invite
      ansible.builtin.command:
        cmd: /usr/local/bin/ways-coordinator invite create -db /var/lib/ways/ways.db -admin -panel-url {{ ways_api_url }}
      become_user: ways
      register: invite
      when: not invited.stat.exists

    - name: Remember the first Admin was invited
      ansible.builtin.file:
        path: /var/lib/ways/first-admin-invited
        state: touch
        owner: ways
        group: ways
        mode: "0600"
      when: not invited.stat.exists

    - name: Show the first Admin's Invite (single use; open it, then turn on TOTP)
      ansible.builtin.debug:
        msg: "{{ invite.stdout | trim }}"
      when: not invited.stat.exists

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        state: restarted

    - name: Restart the Coordinator
      ansible.builtin.systemd_service:
        name: ways-coordinator
        state: restarted
        daemon_reload: true
