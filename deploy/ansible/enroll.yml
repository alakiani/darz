# enroll.yml enrolls Nodes (ADR 0002), or upgrades the Agent on Nodes that
# already enrolled. Roles and Tags come from the inventory group (domestic or
# abroad); the Node's name is its inventory name.
#
#   scripts/darz-ansible enroll.yml              every Node
#   scripts/darz-ansible enroll.yml -l ir-1      one Node
#   scripts/darz-ansible enroll.yml -l ir-1 -e reenroll=true   re-key it
- name: Nodes
  hosts: all:!coordinators
  become: true
  vars:
    reenroll: false
    darz_api_token: "{{ lookup('file', darz_home ~ '/enroll-token') }}"
    darz_api_headers:
      Authorization: "Bearer {{ darz_api_token }}"
  pre_tasks:
    - name: Check the laptop has the release, the pinned CA and the token
      ansible.builtin.assert:
        that:
          - darz_release | length > 0
          - darz_roles is defined
          - (darz_home ~ '/ca.crt') is file
          - (darz_home ~ '/enroll-token') is file
        fail_msg: >-
          Set DARZ_RELEASE, put the Node in the domestic or abroad group, and
          run coordinator.yml first: it brings back ca.crt and enroll-token.
      delegate_to: localhost
      become: false

  tasks:
    - name: Install Ubuntu's packages
      ansible.builtin.apt:
        name: "{{ ['nftables', 'prometheus-node-exporter'] + (['chrony'] if darz_chrony else []) }}"
        update_cache: true
        cache_valid_time: 3600

    - name: Keep node_exporter on loopback; the Agent serves it through /metrics
      ansible.builtin.template:
        src: node-exporter.default.j2
        dest: /etc/default/prometheus-node-exporter
        mode: "0644"
      register: node_exporter_args

    - name: Start node_exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        enabled: true
        state: "{{ 'restarted' if node_exporter_args.changed else 'started' }}"

    - name: Create the directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/darz, mode: "0755" }
        - { path: /usr/local/lib/darz, mode: "0755" }
        - { path: /var/lib/darz-agent, mode: "0700" }

    - name: Install the Agent and the pinned amneziawg-go
      ansible.builtin.copy:
        src: "{{ darz_release_dir }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0755"
      loop:
        - { src: darz-agent, dest: /usr/local/bin/darz-agent }
        - { src: amneziawg-go, dest: /usr/local/lib/darz/amneziawg-go }
      register: binaries

    - name: Pin the Coordinator's CA
      ansible.builtin.copy:
        src: "{{ darz_home }}/ca.crt"
        dest: /etc/darz/ca.crt
        mode: "0644"
      register: ca

    - name: Install the units
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/etc/systemd/system/{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: darz-agent.service.j2, dest: darz-agent.service }
        - { src: "{{ playbook_dir }}/../systemd/darz-awg@.service", dest: "darz-awg@.service" }
      register: units

    # Idempotent: an enrolled Node gets no token unless reenroll is set, and
    # a Node that exists with other Roles or Tags is refused (409).
    - name: Create the Node, or get a fresh enrollment token for it
      ansible.builtin.uri:
        url: "{{ darz_api_url }}/v1/nodes"
        method: POST
        headers: "{{ darz_api_headers }}"
        body_format: json
        body:
          name: "{{ inventory_hostname }}"
          roles: "{{ darz_roles }}"
          tags: "{{ darz_tags }}"
          reenroll: "{{ reenroll | bool }}"
        ca_path: "{{ darz_api_ca_path or omit }}"
      delegate_to: localhost
      become: false
      register: node
      changed_when: node.json.enrollment_token is defined
      no_log: true

    - name: Forget the old identity, to re-key
      ansible.builtin.file:
        path: "/var/lib/darz-agent/{{ item }}"
        state: absent
      loop: [agent.key, agent.crt]
      when: reenroll | bool

    # The Agent uses the token only until it holds a certificate; an empty
    # file afterwards keeps the unit unchanged.
    - name: Hand the Agent its one-time enrollment token
      ansible.builtin.copy:
        content: "{{ node.json.enrollment_token | default('') }}\n"
        dest: /etc/darz/enroll-token
        mode: "0600"
      when: node.json.enrollment_token is defined
      no_log: true
      register: token

    - name: Make sure the token file exists
      ansible.builtin.copy:
        content: "\n"
        dest: /etc/darz/enroll-token
        mode: "0600"
        force: false

    - name: Start the Agent, restarting it if anything changed
      ansible.builtin.systemd_service:
        name: darz-agent
        enabled: true
        daemon_reload: "{{ units.changed }}"
        state: "{{ 'restarted' if (binaries.changed or ca.changed or units.changed or token.changed) else 'started' }}"

    - name: Wait for its first health report from this release
      ansible.builtin.uri:
        url: "{{ darz_api_url }}/v1/nodes/{{ node.json.node.id }}"
        headers: "{{ darz_api_headers }}"
        ca_path: "{{ darz_api_ca_path or omit }}"
      delegate_to: localhost
      become: false
      register: status
      until: >-
        status.json.enrolled
        and status.json.last_health is defined
        and status.json.last_health.agent_version == darz_release
      retries: 60
      delay: 5
      no_log: true

    - name: Empty the used enrollment token
      ansible.builtin.copy:
        content: "\n"
        dest: /etc/darz/enroll-token
        mode: "0600"
      when: token.changed
      no_log: true

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ status.json.id }}) runs {{ darz_release }} as
          {{ darz_roles | join('+') }}{{ ' tagged ' ~ (darz_tags | join(',')) if darz_tags else '' }},
          seen from {{ status.json.last_health.seen_addr }}
