# Everything the playbooks need from the laptop. scripts/darz-ansible loads
# ~/.darz/fleet.env (written by scripts/provision-fleet.sh) into the
# environment first.
darz_home: "{{ lookup('env', 'DARZ_HOME') or (lookup('env', 'HOME') ~ '/.darz') }}"
darz_release: "{{ lookup('env', 'DARZ_RELEASE') }}"
darz_release_dir: "{{ darz_home }}/releases/{{ darz_release }}"

# The Admin API as the laptop reaches it, and the CA it trusts there:
# empty for the public CAs.
darz_api_url: https://4miz.ir
darz_api_ca_path: ""
# What Agents dial (ADR 0002); they trust only the pinned Coordinator CA.
darz_agent_coordinators: https://4miz.ir:8443

# chrony keeps Node clocks right; containers in the deploy test can't run it.
darz_chrony: true
