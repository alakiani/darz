# Everything the playbooks need from the laptop. scripts/ways-ansible loads
# ~/.ways/fleet.env (written by scripts/provision-fleet.sh) into the
# environment first.
ways_home: "{{ lookup('env', 'WAYS_HOME') or (lookup('env', 'HOME') ~ '/.ways') }}"
ways_release: "{{ lookup('env', 'WAYS_RELEASE') }}"
ways_release_dir: "{{ ways_home }}/releases/{{ ways_release }}"

# The Admin API as the laptop reaches it, and the CA it trusts there:
# empty for the public CAs.
ways_api_url: https://4miz.ir
ways_api_ca_path: ""
# What Agents dial (ADR 0002); they trust only the pinned Coordinator CA.
ways_agent_coordinators: https://4miz.ir:8443

# chrony keeps Node clocks right; containers in the deploy test can't run it.
ways_chrony: true
