# Prometheus on the Coordinator VM (ADR 0006). Generated by internal/monitoring; do not edit.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
rule_files:
  - /etc/ways/prometheus/rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
scrape_configs:
  - job_name: agents
    scheme: https
    tls_config:
      ca_file: /etc/ways/prometheus/ca.crt
      cert_file: /etc/ways/prometheus/prometheus.crt
      key_file: /etc/ways/prometheus/prometheus.key
      server_name: agent.ways
    http_sd_configs:
      - url: http://127.0.0.1:9101/v1/sd/agents
        refresh_interval: 30s
  - job_name: coordinator
    static_configs:
      - targets: ["127.0.0.1:9101"]
  - job_name: coordinator-host
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          node: coordinator
